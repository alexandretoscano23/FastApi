[project]
name = "estudos-fastapi"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.162.0",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.6",
    "sqlalchemy-utils>=0.43.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["/src"]
